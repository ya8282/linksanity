name: Bug report
description: Report a bug in linksanity
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: linksanity version
      placeholder: "e.g. 0.1.0 (run `linksanity --version`)"
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "e.g. 3.12.1"
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Command
      description: The exact command you ran
      placeholder: linksanity scan ./docs/ --check-anchors
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Paste the full output or error message
    validations:
      required: true

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check linksanity/ tests/ scripts/

      - name: Type check
        run: mypy linksanity/

      - name: Test (full suite, no browser)
        run: pytest -x -q

  test-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev,browser]"

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Test (all including browser)
        env:
          LINKSANITY_REQUIRE_BROWSER: "1"
        run: pytest -x -q --cov=linksanity --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          file: coverage.xml

  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e .

      # TEMPORARY: ignore ya8282.github.io until GitHub Pages is enabled for
      # this repo (linksanity-b54.11). The docs site returns 404 until then,
      # which would otherwise fail every run. Remove --ignore-domains once
      # the site resolves.
      - name: Dogfood linkcheck
        run: linksanity scan README.md CONTRIBUTING.md --ignore-domains .github/ci-linkcheck-ignore-domains.txt
